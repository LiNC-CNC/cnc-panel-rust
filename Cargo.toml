[package]
name = "szgh-panel-hal"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
linuxcnc-hal = { version = "0.3", optional = true }
serialport = "4.6"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"

[features]
default = ["linuxcnc-hal"]

[profile.release]
opt-level = 3
lto = true

[patch.crates-io]
linuxcnc-hal-sys = { path = "patches/linuxcnc-hal-rs/linuxcnc-hal-sys" }
